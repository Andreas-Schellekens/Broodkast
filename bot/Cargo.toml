[package]
name = "broodkast"
version = "0.1.0"
description = "Broodkast: de Nederlandstalige Discord-bot"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
dotenvy = "0.15"
feed-rs = "3"
futures = "0.3.34"
poise = "0.7.1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
