<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" role="img" aria-label="Broodkast">
  <!-- Beeldmerk: een zenderbadge, zoals een netlogo in de omroepgids -->
  <rect width="420" height="80" fill="#ECEFE8"/>
  <g transform="translate(8 8)">
    <rect width="64" height="64" rx="10" fill="#1E5B47"/>
    <text x="32" y="44" text-anchor="middle" font-family="Archivo, sans-serif" font-stretch="125%" font-size="28" font-weight="800" fill="#F4C430">BK</text>
    <circle cx="53" cy="11" r="4.5" fill="#C8873A"/>
  </g>
  <text x="88" y="54" font-family="Archivo, sans-serif" font-stretch="125%" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#17201C">BROOD<tspan fill="#1E5B47">KAST</tspan></text>
</svg>
