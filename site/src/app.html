<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0806" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Inter+Tight:wght@400;500;600&display=swap"
		/>
		<script>
			// Met JS verbergen we de te animeren elementen tot GSAP ze overneemt (zie global.css).
			document.documentElement.classList.add('js');
			// Vangnet: als het script faalt, wordt na 3 s alles zichtbaar. Wat GSAP al overnam, houdt zijn eigen stijl.
			setTimeout(function () {
				document.documentElement.classList.remove('js');
			}, 3000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
